version: '3'

vars:
  FLAKE: '{{.ROOT_DIR}}/nix'

tasks:
  default:
    silent: true
    cmd: task --list

  nix:check:
    desc: "nix flake check"
    platforms: [linux]
    cmds:
      - nix flake check {{.FLAKE}}
      - nix run nixpkgs#statix -- check {{.FLAKE}}
      - nix run nixpkgs#deadnix -- --fail {{.FLAKE}}

  test:
    desc: "Render chezmoi templates (3 profiles) and zsh -n lint"
    cmd: test/render-and-lint.sh

  check:
    desc: "Run checks available on the current platform"
    cmds:
      - task: test
      - task: nix:check
        platforms: [linux]
