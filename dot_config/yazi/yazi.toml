#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio        = [ 0, 1, 0 ]
show_hidden  = false
mouse_events = [ "click", "scroll", "drag" ]

[opener]
enter = [ { run = "ya emit cd %s1", desc = "Enter" } ]
glow  = [ { run = "glow -p %s1", block = true, desc = "glow", for = "unix" } ]
bat   = [ { run = "bat --paging=always %s1", block = true, desc = "bat", for = "unix" } ]

[open]
prepend_rules = [
	{ mime = "folder/*", use = [ "enter", "open", "reveal" ] },
	{ url = "*.md", use = [ "glow", "reveal" ] },
	{ mime = "text/*", use = [ "bat", "reveal" ] },
	{ mime = "application/{json,ndjson,javascript}", use = [ "bat", "reveal" ] },
	{ mime = "inode/empty", use = [ "bat", "reveal" ] },
]

[[plugin.prepend_previewers]]
url = "*.md"
run = 'piper -- CLICOLOR_FORCE=1 glow -w="$w" -s="$([ "$t" = light ] && echo light || echo dark)" "$1"'

[[plugin.prepend_previewers]]
mime = "text/*"
run  = 'piper -- bat -p --color=always "$1"'

[[plugin.prepend_previewers]]
mime = "application/{json,ndjson,javascript}"
run  = 'piper -- bat -p --color=always "$1"'
