# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
# Packages missing from the aqua standard registry.
packages:
  - type: go_install
    repo_owner: tomasz-tomczyk
    repo_name: crit
    path: github.com/tomasz-tomczyk/crit/cmd/crit
    description: Review AI coding agents' plans, diffs and running apps in the browser
    files:
      - name: crit
  - type: github_release
    repo_owner: zenbu-labs
    repo_name: terminal-browser
    description: A real browser inside your terminal
    asset: terminal-browser-{{.OS}}-{{.Arch}}.tar.gz
    format: tar.gz
    version_filter: Version startsWith "v"
    replacements:
      amd64: x64
    files:
      - name: terminal-browser
        src: terminal-browser/bin/terminal-browser
