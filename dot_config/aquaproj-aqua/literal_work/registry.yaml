# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
# Packages missing from the aqua standard registry.
packages:
  - type: github_release
    repo_owner: backnotprop
    repo_name: plannotator
    description: Browser UI for reviewing coding agent plans, diffs, and Markdown
    asset: plannotator-{{.OS}}-{{.Arch}}
    format: raw
    replacements:
      amd64: x64
    supported_envs:
      - darwin
      - linux
    files:
      - name: plannotator
    checksum:
      type: github_release
      asset: "{{.Asset}}.sha256"
      algorithm: sha256
    github_artifact_attestations:
      signer_workflow: backnotprop/plannotator/.github/workflows/release.yml
