# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
# Packages missing from the aqua standard registry.
packages:
  - type: go_install
    repo_owner: tomasz-tomczyk
    repo_name: crit
    path: github.com/tomasz-tomczyk/crit/cmd/crit
    description: Review AI coding agents' plans, diffs and running apps in the browser
    files:
      - name: crit
  - type: github_release
    repo_owner: kunobi-ninja
    repo_name: kache
    description: Content-addressed zero-copy build cache for Rust, C/C++ and more
    asset: kache-{{.Arch}}-{{.OS}}.tar.gz
    format: tar.gz
    replacements:
      arm64: aarch64
      darwin: apple-darwin
    supported_envs:
      - darwin/arm64
    checksum:
      type: github_release
      asset: "{{.Asset}}.sha256"
      algorithm: sha256
    files:
      - name: kache
