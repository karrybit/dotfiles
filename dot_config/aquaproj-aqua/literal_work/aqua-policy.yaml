# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/policy.json
# Loaded through AQUA_POLICY_CONFIG. Allows the standard registry plus only the
# named packages from the profile's local registry.
registries:
  - type: standard
    ref: semver(">= 4.0.0")
  - name: local
    type: local
    path: registry.yaml
packages:
  - registry: standard
  - name: backnotprop/plannotator
    registry: local
