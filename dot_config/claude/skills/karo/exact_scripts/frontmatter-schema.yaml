# Frontmatter rules for the karo records (OKF v0.2), read by okf-lint through karo-check.
# Every note requires a date and a description. type, tasks and projects are optional; karo-check checks
# the form of tasks and projects when a note has them. Paths matching exclude are not checked.
required: [date, description]
exclude:
  - '^investigation/[^/]+/log\.md$'
  - '^investigation/[^/]+/sources/'
